<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" width="1200" height="920">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#607d8b"/>
    </marker>
    <marker id="arrow-dash" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#90a4ae"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <style>
      .title { font: 700 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1a1a2e; }
      .subtitle { font: 400 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #555; }
      .box { rx: 10; filter: url(#shadow); }
      .label { font: 600 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .sublabel { font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #444; }
      .edge-label { font: 500 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #546e7a; }
      .group-title { font: 700 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #37474f; }
      .line { fill: none; stroke: #607d8b; stroke-width: 2; marker-end: url(#arrow); }
      .line-dash { fill: none; stroke: #90a4ae; stroke-width: 1.5; stroke-dasharray: 6 4; marker-end: url(#arrow-dash); }
    </style>
  </defs>

  <rect width="1200" height="920" fill="#f5f7fa"/>

