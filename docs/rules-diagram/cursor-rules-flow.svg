  <text x="60" y="798" class="group-title">&#x1021;&#x1000;&#x103a;&#x1015;&#x103c;&#x1031;&#x102c;&#x103a;&#x1000;&#x103a;&#x1015;&#x103c;&#x1021;&#x1036;&#x1038;</text>
  <text x="60" y="824" class="sublabel" fill="#333">
